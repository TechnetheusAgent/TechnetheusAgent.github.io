    const raw = new Uint8Array(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
    const headLen = new DataView(raw.buffer).getUint32(0, true), base = 4 + headLen;
    const head = JSON.parse(new TextDecoder().decode(raw.subarray(4, base)));
    const part = (o) => raw.slice(base + o[0], base + o[0] + o[1]);
    const KIND = { f32: Float32Array, u16: Uint16Array, u32: Uint32Array, u8: Uint8Array };
    const bundle = {};
    for (const [k, o] of Object.entries(head.arrays)) bundle[k] = new KIND[o[2]](part(o).buffer);
    globalThis.__BUNDLE__ = bundle;
    const url = {};
    for (const [name, o] of head.modules) {
      let src = new TextDecoder().decode(part(o));
      for (const dep of Object.keys(url)) src = src.split('@@' + dep + '@@').join(url[dep]);
      url[name] = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    }
    await import(url.player);
  } catch (e) {
    console.error(e);
    const box = document.getElementById('err');
    box.style.display = 'block';
    box.textContent = 'Could not start: ' + e.message + '\n(this page needs a current browser: Chrome or Edge 80+, Firefox 113+, Safari 16.4+)';
  }
})();
</script>
